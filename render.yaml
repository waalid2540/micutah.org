databases:
  - name: micutah-db
    plan: free
    databaseName: micutah
    user: micutah

services:
  - type: web
    name: micutah
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: micutah-db
          property: connectionString
